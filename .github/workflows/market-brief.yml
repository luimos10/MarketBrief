name: Market Brief

on:
  # El timing lo controla un scheduler externo (cron-job.org) que dispara este
  # workflow via la API de GitHub (workflow_dispatch) a la hora exacta, 30 min
  # antes de la apertura de cada bolsa y en la zona horaria de cada una (asi el
  # DST se ajusta solo). Ya no usamos el cron de GitHub: es poco puntual y
  # retrasaba/descartaba los disparos. workflow_dispatch tambien permite probar
  # a mano desde la UI de GitHub.
  workflow_dispatch:

concurrency:
  group: market-brief
  cancel-in-progress: false

permissions:
  contents: write           # para commitear el logbook de vuelta

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt || (sleep 10 && pip install -r requirements.txt)

      - name: Run tests
        run: python -m pytest -q

      # Evaluar antes de generar el brief para que el dashboard de rendimiento
      # del HTML use las métricas recién calculadas. Un fallo del evaluador no
      # debe bloquear la entrega del brief.
      - name: Evaluate pending calls
        continue-on-error: true
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python evaluate_calls.py --write

      - name: Generate & deliver brief
        env:
          GEMINI_API_KEY:      ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN:  ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:    ${{ secrets.TELEGRAM_CHAT_ID }}
          CMC_API_KEY:         ${{ secrets.CMC_API_KEY }}
          FMP_API_KEY:         ${{ secrets.FMP_API_KEY }}
          FRED_API_KEY:        ${{ secrets.FRED_API_KEY }}
          CRYPTOPANIC_API_KEY: ${{ secrets.CRYPTOPANIC_API_KEY }}
          FINNHUB_API_KEY:     ${{ secrets.FINNHUB_API_KEY }}
        run: python brief.py --telegram --no-open

      - name: Commit logbook (calls.jsonl + sidecars + perf)
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/ 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "brief: $(date -u +%FT%TZ) [skip ci]"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      # Aviso si algo falla (Gemini 503 persistente, geobloqueo, etc.). Sin esto,
      # un fallo solo se ve en la pestaña Actions y pasa desapercibido.
      - name: Notify on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=⚠️ Market Brief falló (run ${GITHUB_RUN_ID}). Revisa la pestaña Actions: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            > /dev/null || true
