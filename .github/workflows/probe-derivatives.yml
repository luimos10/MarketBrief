name: Probe Derivatives Sources

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/probe_derivatives.py"
      - ".github/workflows/probe-derivatives.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install requests
        run: pip install requests
      - name: Run probe
        run: python tools/probe_derivatives.py
